spring.application.name=sdui-server

# OpenTelemetry Configuration
otel.sdk.disabled=false
otel.traces.sampler=parentbased_traceidratio
otel.traces.sampler.arg=0.01

# OTLP Exporter Configuration (Jaeger via OTLP)
otel.exporter.otlp.endpoint=http://localhost:4318
otel.exporter.otlp.traces.endpoint=http://localhost:4318/v1/traces
otel.traces.exporter=otlp
otel.service.name=sdui-server

# Enable debug logging for trace exports
logging.level.io.opentelemetry.exporter.otlp=DEBUG
logging.level.com.thinkuldeep.sdui.server.OtelConfig=INFO